id: emba
version: 0.1.0
contract_version: "1.0"

candidate:
  name: "EMBA - Embedded Linux Analyzer"
  source_repo: "https://github.com/e-m-b-a/emba"
  pinned_commit: "5496d5c0782190f6dfad7cfd598d5826a1b4d620"
  # NOTE: EMBA's own documentation states it is designed for x86-64 and is
  # not tested on ARM. Four ARM64-specific installer bugs were found and
  # fixed to get a working build on this ARM64 dev host — see patches/.
  # Final paper measurements should still be taken on native amd64 hardware,
  # consistent with the FirmAE/FIRMADYNE compute-cost caveat.

build:
  dockerfile: Dockerfile
  base_images:
    - "kalilinux/kali-rolling@sha256:776d57c9d607faafef9957073b0b5a05b0d1115e5728777a8fc5588827cfd249"
  # CVE database population was skipped at build time via EMBA's own -g
  # (GH_ACTION) flag, since it depends on unreliable multi-source network
  # fetches (NVD, GitLab, RedHat, OSV) unsuited to a reproducible build.
  # This means EMBA's own CVE-lookup modules will run without a populated
  # database until one is supplied separately post-build.

runtime:
  platform: "linux/arm64"  # built and verified on this host; EMBA upstream
                            # only officially supports/tests linux/amd64
  network_mode: "bridge"   # EMBA's docker-compose.yml does not set
                            # network_mode on the main service (only the
                            # read-only "emba_quest" variant uses host mode)
  privileged: true          # required by EMBA's own docker-compose.yml for
                            # loop-mount/fuse-based extraction and dynamic
                            # analysis; same class of requirement as
                            # FIRMADYNE's loop-device and FirmAE's TAP
                            # networking needs (see Finding F19 precedent)
  devices:
    - "/dev/fuse:/dev/fuse:rwm"

capabilities:
  unpack: true
  emulate: true   # via a separate scan profile (default-scan-emulation.emba);
                   # the default profile (default-scan.emba) is static-analysis
                   # only — v0.1.0 targets static analysis first
  endpoint_discovery: false  # not applicable to v0.1.0's static-only scope
  reports_own_endpoint_claims: false
