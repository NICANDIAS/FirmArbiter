id: emba
version: 0.3.0
contract_version: "1.0"

candidate:
  name: "EMBA - Embedded Linux Analyzer"
  source_repo: "https://github.com/e-m-b-a/emba"
  pinned_commit: "5496d5c0782190f6dfad7cfd598d5826a1b4d620"
  # NOTE: upstream officially supports/tests only x86-64. This adapter
  # runs the official maintainer-built image (embeddedanalyzer/emba:2.0.2b)
  # under QEMU amd64-on-arm64 translation on ARM64 hosts — same accepted
  # tradeoff as FirmAE, FIRMADYNE, fact_extractor. Confirmed working via a
  # full real-firmware run; see DIND_INVESTIGATION_NOTES.md for the full
  # investigation.

build:
  dockerfile: Dockerfile
  base_images:
    - "embeddedanalyzer/emba:2.0.2b@sha256:db3d2023e842d1cc1f7a5645608f4c3fcb49daacc1a514a1b83a78d3a0465e53"
  # Base image is the OFFICIAL, maintainer-published, fully-populated
  # EMBA image (35.9GB) — NOT built from source via installer.sh. Two
  # full sessions attempting a from-scratch build via installer.sh hit
  # repeated flag conflicts (DOCKER_SETUP/-D/-g) that silently skipped
  # installing binwalk/unblob. Building from the official image instead
  # sidesteps this entirely. EMBA's own script/module source (pinned
  # commit above) is cloned fresh into the image at build time.

runtime:
  platform: "linux/amd64"  # no ARM64 manifest published upstream
  network_mode: "none"
  privileged: true
  devices:
    - "/dev/fuse:/dev/fuse:rwm"
  # CRITICAL: an explicit memory limit is REQUIRED, not optional. An
  # uncapped EMBA run was confirmed to consume enough RAM to trigger the
  # HOST machine's OOM killer (not just the container's), crashing
  # unrelated services running on the same host. Recommended minimum:
  # 5GB container memory cap. The coordinator/runner invoking this
  # adapter must pass an equivalent Docker memory limit.
  memory_limit_gb: 5
  # CRITICAL: expect LONG runtimes. Confirmed real timing: ~13 hours for
  # one firmware sample (DIR-868L REVB) under QEMU translation, using
  # EMBA's default-scan.emba profile. The two slowest individual modules
  # were S109_jtr_local_pw_cracking (~2h) and S115_usermode_emulator
  # (~1.5h). Any timeout configured for this adapter must be generous
  # (recommend 50000+ seconds) or runs will be killed as false failures.

capabilities:
  unpack: true
  emulate: false  # limited per-binary emulation happens INSIDE the single
                   # full-scan run (S115_usermode_emulator), not as an
                   # independently triggerable stage in this adapter version
  endpoint_discovery: false  # static scan only, firmware is never booted
                               # into a live/reachable state
  reports_own_endpoint_claims: false
