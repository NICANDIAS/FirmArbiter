schema_version: '1.0'
adapter:
  id: firmae
  display_name: FirmAE Adapter
  description: VERITAS reference adapter for a pinned FirmAE source revision
  version: 0.1.0
  contract_version: '1.0'
candidate:
  name: FirmAE
  source:
    type: git
    repository: https://github.com/pr0v3rbs/FirmAE.git
    commit: dd98505984feac91cf113e13d5de01a4fc1574f2
  patches: []
build:
  context: .
  dockerfile: Dockerfile
  platform: linux/amd64
  base_images:
  - ubuntu:22.04@sha256:ce941a2a18bbb922e434d6d6d2b31e571a5c3826eaf6ada0a41dcc905bd2d906
runtime:
  run_as_root: true
  network: host
  requirements:
  - loop-devices
  - device-mapper
  - tun-tap
  - net-admin
  - full-privileged
capabilities:
  stages:
  - unpack
  - emulate
  - endpoint-discovery
  firmware_architectures:
  - unknown
  endpoint_protocols:
  - http
  hints:
    architecture: optional
    vendor: unsupported
