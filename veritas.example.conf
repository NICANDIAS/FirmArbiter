# veritas.conf
# ─────────────────────────────────────────────────────────────────────────────
# VERITAS configuration.
# Edit the paths below to match your machine.
# This is the only file you need to edit before running VERITAS.
# ─────────────────────────────────────────────────────────────────────────────

# ── Tool installation paths ───────────────────────────────────────────────────
# Set each to the root directory of that tool on your machine.

FIRMAE_DIR=/home/ubuntu/Desktop/FirmAE
FIRMADYNE_DIR=/home/ubuntu/firmadyne
EMBA_DIR=/home/ubuntu/emba
PIPELINE_DIR=/home/ubuntu/firmware-security

# ── Run settings ──────────────────────────────────────────────────────────────

# Hard ceiling — absolute maximum seconds before killing any run.
# Set high so genuinely working tools are not cut off artificially.
# The benchmark measures actual runtime, not timeout proximity.
# 10800 = 3 hours. Lower this only if disk/time is severely constrained.
TIMEOUT_SECONDS=10800

# Stall detection — if a tool has near-zero CPU for this many seconds
# it is considered stuck and will be killed. This catches genuinely hung
# processes while allowing slow-but-working tools to complete.
# 600 = 10 minutes of idle before declaring stuck.
STALL_TIMEOUT_SECONDS=600

# How long to allow the Docker image build to run in total (seconds).
# 1800 = 30 minutes. Increase on very slow connections.
BUILD_TIMEOUT_SECONDS=1800

# How long the Docker build is allowed to produce NO output before
# VERITAS assumes it is stuck and kills it (seconds).
# 300 = 5 minutes of silence before giving up.
# This must be long enough to cover large package downloads (e.g. qemu-system-arm
# is ~60MB and can take 3-4 minutes on a slow connection without printing anything).
# Only lower this if you are on a network where builds genuinely hang forever
# and you want them to fail faster.
BUILD_STALL_TIMEOUT_SECONDS=300

# ── Output directories ────────────────────────────────────────────────────────
# These are relative to the veritas/ folder. No need to change normally.

RESULTS_DIR=results/runs
LOGS_DIR=results/logs
REPORTS_DIR=reports
UNPACK_CACHE_DIR=results/unpack_cache
