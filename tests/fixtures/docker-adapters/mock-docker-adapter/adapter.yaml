schema_version: "1.0"

adapter:
  id: mock-docker-adapter
  display_name: Mock Docker Contract Adapter
  description: Containerised fixture for testing the neutral Docker backend.
  version: "0.1.0"
  contract_version: "1.0"

candidate:
  name: Mock Docker Candidate
  source:
    type: git
    repository: https://example.invalid/mock-docker-candidate.git
    commit: "0123456789abcdef0123456789abcdef01234567"
  patches: []

build:
  context: .
  dockerfile: Dockerfile
  platform: linux/arm64
  base_images:
    - python@sha256:6c4dd321d176d61ea848dc8c73a4f7dbae8f70e0ee48bb411ea2f045b599fa8e

runtime:
  run_as_root: false
  network: none
  requirements: []

capabilities:
  stages:
    - unpack
    - emulate
    - endpoint-discovery
  firmware_architectures:
    - unknown
  endpoint_protocols:
    - http
  hints:
    architecture: optional
    vendor: unsupported
